version: "2"
type: frontend
tech_stack:
  - javascript
  - react
  - vite
  - tailwindcss
  - i18next
routes:
  - path: /
    file: src/App.jsx
    auth_required: false
    description: Main Chat and Settings page
features:
  - name: Chat with AI
    description: Real-time chat with Gemini AI model
    files:
      - src/App.jsx
      - src/lib/gemini.js
    entry_route: /
    user_interactions:
      - Type message in input field
      - Click Send button
      - See AI response streaming
    api_calls:
      - method: POST
        endpoint: https://generativelanguage.googleapis.com
  - name: Settings Management
    description: Configure API keys, theme, and AI behavior
    files:
      - src/App.jsx
    entry_route: /
    user_interactions:
      - Click Settings icon
      - Switch between API, General, and AI tabs
      - Add/Remove API keys
      - Change theme settings
      - Click Save button
  - name: Screen Capture
    description: Take screenshots and send to AI
    files:
      - src/App.jsx
    entry_route: /
    user_interactions:
      - Click Scissors icon
      - Select area on screen
      - Confirm or Cancel crop
known_limitations:
  - issue: Extension environment required for some features (chrome.storage, tabs)
    location: src/App.jsx
    impact: Local dev server may have limited functionality without extension context
